name: Verify independent source
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install "pytest>=8,<9"
      - run: python -m ai4gd audit --release
      - run: python -m pytest tests -q
